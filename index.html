<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Componentes principales y fracciones de la sangre</title>
    <style id="hover-style"></style>
    <style>
        :root {
            --bg-color: #f8fafc;
            --panel-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --viz-bg: #f1f5f9;
            --input-bg: #ffffff;
            --active-bg: #f0f9ff;
            --edit-hover-bg: #e0f2fe;
            --delete-hover-bg: #fee2e2;
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --viz-bg: #020617;
            --input-bg: #0f172a;
            --active-bg: #1e3a8a;
            --edit-hover-bg: rgba(59, 130, 246, 0.2);
            --delete-hover-bg: rgba(239, 68, 68, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Sidebar & Form */
        .sidebar {
            width: 380px;
            flex-shrink: 0; /* Asegura que el menú no se aplaste */
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            font-size: 1.25rem;
            color: var(--text-main);
            line-height: 1.2;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .btn-theme {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text-main);
            padding: 5px;
            border-radius: 50%;
            transition: background-color 0.2s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
        }
        .btn-theme:hover {
            background-color: var(--border-color);
        }

        .accordion-header {
            padding: 15px 20px;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: var(--text-main);
            transition: background-color 0.2s;
            font-size: 0.95rem;
        }
        .accordion-header:hover {
            background-color: var(--border-color);
        }
        .chevron {
            transition: transform 0.3s ease;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .chevron.open {
            transform: rotate(180deg);
        }

        .form-section {
            display: none;
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-color);
        }
        .form-section.open {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            background-color: var(--input-bg);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .radio-group {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }

        .radio-label {
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: normal;
        }

        .radio-label input {
            margin-right: 6px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="color"] {
            width: 40px;
            height: 40px;
            padding: 2px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            background-color: var(--input-bg);
        }

        button.btn-add {
            width: 100%;
            padding: 10px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 5px;
        }

        button.btn-add:hover {
            background-color: var(--primary-hover);
        }

        button.btn-cancel {
            width: 100%;
            padding: 10px;
            background-color: var(--border-color);
            color: var(--text-main);
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, filter 0.2s;
            margin-top: 10px;
        }

        button.btn-cancel:hover {
            filter: brightness(0.9);
        } 

        /* List Section */
        .list-section {
            padding: 20px;
            flex-grow: 1;
        }

        .list-section h2 {
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .component-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.1s;
        }

        .component-item:hover {
            border-color: var(--primary);
            transform: translateX(2px);
        }
        
        .component-item.active {
            border-color: var(--primary);
            background-color: var(--active-bg);
            box-shadow: 0 0 0 1px var(--primary);
        }

        .component-item.fraction {
            margin-left: 20px;
            border-left: 3px solid var(--border-color);
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-dot {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            border: 1px solid rgba(0,0,0,0.1);
        }
        
        .item-actions {
            display: flex;
            gap: 5px;
        }

        .btn-action {
            background: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .btn-edit { color: var(--primary); }
        .btn-edit:hover { background: var(--edit-hover-bg); }
        
        .btn-delete { color: var(--danger); }
        .btn-delete:hover { background: var(--delete-hover-bg); }

        /* Sidebar Footer (Sticky) */
        .sidebar-footer {
            position: sticky;
            bottom: 0;
            background-color: var(--panel-bg);
            padding: 15px 20px;
            border-top: 1px solid var(--border-color);
            z-index: 20;
            margin-top: auto;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .btn-restore {
            width: 100%;
            background-color: #7f1d1d; /* Rojo oscuro */
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-restore:hover {
            background-color: #991b1b;
            transform: translateY(-1px);
        }

        /* Visualization Area */
        .viz-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative; /* Para que el botón de restaurar flote correctamente */
            background-color: var(--viz-bg);
            overflow: hidden;
            transition: background-color 0.3s;
        }

        /* Top Bar / Restore Button */
        .btn-restore {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #7f1d1d; /* Rojo oscuro */
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s, transform 0.1s;
            z-index: 50;
        }

        .btn-restore:hover {
            background-color: #991b1b;
            transform: translateY(-1px);
        }

        /* Chart Switcher */
        .switcher-container {
            display: flex;
            justify-content: center;
            width: 100%;
            padding-top: 30px;
            z-index: 20;
        }

        .chart-switcher {
            display: flex;
            position: relative;
            background: var(--border-color);
            border-radius: 30px;
            padding: 4px;
            width: 350px;
        }

        .switcher-slider {
            position: absolute;
            top: 4px; 
            left: 4px;
            width: calc(50% - 4px); 
            height: calc(100% - 8px);
            background: var(--panel-bg);
            border-radius: 26px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
            z-index: 1;
        }

        .switcher-btn {
            flex: 1;
            text-align: center;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            position: relative;
            z-index: 2;
            transition: color 0.3s;
            user-select: none;
        }

        .switcher-btn.active {
            color: var(--text-main);
        }

        .viz-area {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 40px 40px 40px;
        }

        /* 
         * Waffle Chart / Canvas Logic
         */
        #grid-canvas {
            width: 100%;
            max-width: 65vh; /* Ajuste para mantener un buen tamaño en pantalla */
            max-height: 65vh;
            aspect-ratio: 1 / 1;
            background-color: transparent;
            cursor: crosshair;
        }

        #grid-canvas.is-area {
            background-color: var(--panel-bg);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-color);
        }

        /* Tooltip */
        #tooltip {
            position: fixed; /* Coordenadas exactas en pantalla */
            background: rgba(15, 23, 42, 0.95);
            color: white;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            pointer-events: none;
            display: none;
            z-index: 100;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            line-height: 1.4;
            transform: translate(0, 0); 
        }
        
        #tooltip.pinned {
            pointer-events: auto; /* Permite hacer clic en el botón de cerrar */
        }

        #tooltip strong {
            font-size: 1rem;
            color: #f8fafc;
            padding-right: 15px; /* Espacio para el botón X */
            display: inline-block;
        }
        #tooltip .pct {
            color: #94a3b8;
        }
        
        .close-tooltip {
            position: absolute;
            top: 5px;
            right: 8px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: bold;
            line-height: 1;
        }
        .close-tooltip:hover {
            color: white;
        }

        /* Mobile Responsive adjustments */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: auto;
                overflow-y: auto;
            }
            .sidebar {
                width: 100%;
                max-height: none;
                border-right: none;
                border-bottom: 2px solid var(--border-color);
            }
            .viz-wrapper {
                width: 100%;
                min-height: 500px;
                overflow: visible;
                padding-top: 20px;
            }
            .switcher-container {
                padding-top: 10px;
            }
            .chart-switcher {
                width: 300px;
            }
            .viz-area {
                padding: 20px;
            }
            #grid-canvas {
                max-width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar Data Entry -->
    <div class="sidebar">
        <div class="header" style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;">
            <div>
                <h1>Componentes principales y fracciones de la sangre</h1>
                <p>10,000 Cuadros Proporcionales (0.01% c/u)</p>
            </div>
            <button onclick="toggleTheme(true)" class="btn-theme" id="theme-icon" title="Alternar Modo">🌙</button>
        </div>

        <div class="accordion-header" onclick="toggleAccordion()">
            Agregar componentes/fracciones <span class="chevron" id="form-chevron">▼</span>
        </div>

        <div class="form-section" id="form-content">
            <div class="form-group">
                <label>Tipo de Componente</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="comp-type" value="main" checked onchange="toggleParentSelect()"> Principal
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="comp-type" value="fraction" onchange="toggleParentSelect()"> Fracción Menor
                    </label>
                </div>
            </div>

            <div class="form-group" id="parent-group" style="display: none;">
                <label for="parent-select">Pertenece a (Componente Principal)</label>
                <select id="parent-select">
                    <!-- Populated dynamically -->
                </select>
            </div>

            <div class="form-group">
                <label for="comp-name">Nombre</label>
                <input type="text" id="comp-name" placeholder="ej., Plasma, Albúmina..." autocomplete="off">
            </div>

            <div class="form-group" id="pct-context-group" style="display: none;">
                <label>El porcentaje ingresado es respecto a:</label>
                <div class="radio-group" style="margin-bottom: 5px;">
                    <label class="radio-label">
                        <input type="radio" name="pct-context" value="whole" checked> La Sangre Total
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="pct-context" value="parent"> El Componente Principal
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="comp-pct">Valor del Porcentaje (%)</label>
                <input type="number" id="comp-pct" step="0.01" min="0.01" max="100" placeholder="ej., 55">
            </div>

            <div class="form-group">
                <label>Color</label>
                <div class="color-picker-container">
                    <input type="color" id="comp-color">
                    <span style="font-size: 0.85rem; color: var(--text-muted)">Elige un color representativo</span>
                </div>
            </div>

            <button class="btn-add" id="btn-submit" onclick="saveComponent()">Añadir al Gráfico</button>
            <button class="btn-cancel" id="btn-cancel" onclick="cancelEdit()" style="display: none;">Cancelar Edición</button>
        </div>

        <div class="list-section">
            <h2>Datos Actuales (<span id="total-pct-label">0</span>%)</h2>
            <div id="components-list">
                <!-- List renders here -->
            </div>
        </div>

        <div class="sidebar-footer">
            <button class="btn-restore" onclick="restoreDefaults()">Restaurar a valores por defecto</button>
        </div>
    </div>

    <!-- Graphic Visualization -->
    <div class="viz-wrapper">
        
        <div class="switcher-container">
            <div class="chart-switcher">
                <div class="switcher-slider" id="switcher-slider"></div>
                <div class="switcher-btn active" id="btn-area" onclick="setChartType('area')">Gráfico de área</div>
                <div class="switcher-btn" id="btn-pie" onclick="setChartType('pie')">Gráfico circular</div>
            </div>
        </div>

        <div class="viz-area">
            <canvas id="grid-canvas" class="is-area" width="1000" height="1000"></canvas>
            <div id="tooltip"></div>
        </div>
    </div>

    <script>
        // --- Initialization & Theme Logic ---
        
        function detectOSTheme() {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.body.classList.add('dark-mode');
                document.getElementById('theme-icon').textContent = '☀️';
            } else {
                document.body.classList.remove('dark-mode');
                document.getElementById('theme-icon').textContent = '🌙';
            }
        }
        
        // Listen to OS changes dynamically
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', detectOSTheme);
        
        // Manual Toggle
        function toggleTheme(manual = false) {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('theme-icon').textContent = isDark ? '☀️' : '🌙';
            drawCanvas(); // Re-draw to update grid/pie colors matching the theme
        }

        // Apply theme on load
        detectOSTheme();


        // --- Chart Switcher Logic ---

        let currentChartType = 'area';

        function setChartType(type) {
            currentChartType = type;
            const slider = document.getElementById('switcher-slider');
            const btnArea = document.getElementById('btn-area');
            const btnPie = document.getElementById('btn-pie');
            const canvas = document.getElementById('grid-canvas');

            if (type === 'area') {
                slider.style.transform = 'translateX(0)';
                btnArea.classList.add('active');
                btnPie.classList.remove('active');
                canvas.classList.add('is-area');
            } else {
                slider.style.transform = 'translateX(100%)';
                btnPie.classList.add('active');
                btnArea.classList.remove('active');
                canvas.classList.remove('is-area');
            }
            drawCanvas();
        }

        // --- Data & State ---
        
        const initialBloodData = [
            { id: 'c1', type: 'main', name: 'Plasma', pct: 54.5, color: '#fde047' },
            { id: 'c2', type: 'main', name: 'Glóbulos Rojos', pct: 44.5, color: '#ef4444' },
            { id: 'c3', type: 'main', name: 'Glóbulos Blancos', pct: 0.5, color: '#cbd5e1' },
            { id: 'c4', type: 'main', name: 'Plaquetas', pct: 0.5, color: '#a855f7' },
            { id: 'f1', type: 'fraction', parentId: 'c1', name: 'Agua del Plasma', pct: 50.14, color: '#bfdbfe' },
            { id: 'f2', type: 'fraction', parentId: 'c1', name: 'Albúmina', pct: 2.0, color: '#fef08a' },
            { id: 'f3', type: 'fraction', parentId: 'c1', name: 'Inmunoglobulinas', pct: 1.0, color: '#fca5a5' },
            { id: 'f4', type: 'fraction', parentId: 'c1', name: 'Factores de coag.', pct: 0.15, color: '#93c5fd' },
            { id: 'f5', type: 'fraction', parentId: 'c1', name: 'CCP', pct: 0.05, color: '#d8b4fe' },
            { id: 'f6', type: 'fraction', parentId: 'c1', name: 'Fibrinógeno', pct: 0.15, color: '#fbcfe8' },
            { id: 'f7', type: 'fraction', parentId: 'c1', name: 'Crioprecipitado', pct: 0.05, color: '#6ee7b7' },
            { id: 'f8', type: 'fraction', parentId: 'c2', name: 'Agua de G. Rojos', pct: 29.86, color: '#60a5fa' },
            { id: 'f9', type: 'fraction', parentId: 'c2', name: 'Hemoglobina', pct: 14.64, color: '#7f1d1d' }
        ];

        let bloodData = JSON.parse(JSON.stringify(initialBloodData));
        let editingId = null;
        let cellsData = new Array(10000);
        let pieSlices = [];
        let hoveredId = null;
        let pinnedId = null;

        function restoreDefaults() {
            if (confirm("¿Estás seguro de que deseas borrar todos los cambios y volver a los valores médicos por defecto?")) {
                bloodData = JSON.parse(JSON.stringify(initialBloodData));
                cancelEdit();
                updateApp();
            }
        }

        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        document.getElementById('comp-color').value = getRandomColor();

        function toggleParentSelect() {
            const isFraction = document.querySelector('input[name="comp-type"]:checked').value === 'fraction';
            document.getElementById('parent-group').style.display = isFraction ? 'block' : 'none';
            document.getElementById('pct-context-group').style.display = isFraction ? 'block' : 'none';
        }

        function saveComponent() {
            const type = document.querySelector('input[name="comp-type"]:checked').value;
            const name = document.getElementById('comp-name').value.trim();
            let pct = parseFloat(document.getElementById('comp-pct').value);
            const pctContext = document.querySelector('input[name="pct-context"]:checked').value;
            const color = document.getElementById('comp-color').value;
            const parentId = document.getElementById('parent-select').value;

            if (!name || isNaN(pct) || pct <= 0) {
                alert("Por favor ingresa un nombre válido y un porcentaje mayor a 0.");
                return;
            }

            if (editingId) {
                const existing = bloodData.find(d => d.id === editingId);
                if (existing.type === 'main' && type === 'fraction') {
                    const hasChildren = bloodData.some(d => d.parentId === editingId);
                    if (hasChildren) {
                        alert("No puedes cambiar un Componente Principal a Fracción si tiene fracciones menores dentro de él. Elimínalas primero.");
                        return;
                    }
                }
            }

            let currentMainPct = bloodData.filter(d => d.type === 'main' && d.id !== editingId).reduce((s, d) => s + d.pct, 0);
            
            if (type === 'main') {
                if (pct >= 100) pct = 99.99; 
                if (currentMainPct + pct > 100) {
                    let scale = (100 - pct) / currentMainPct;
                    bloodData.forEach(d => {
                        if (d.id !== editingId) { 
                            d.pct = parseFloat((d.pct * scale).toFixed(4));
                        }
                    });
                }
            } else {
                if (!parentId) {
                    alert("Por favor selecciona a qué Componente Principal pertenece.");
                    return;
                }
                if (editingId && parentId === editingId) {
                    alert("Un componente no puede pertenecerse a sí mismo.");
                    return;
                }
                
                let parent = bloodData.find(d => d.id === parentId);
                
                if (pctContext === 'parent') {
                    if (pct >= 100) pct = 99.99;
                    pct = parseFloat(((pct / 100) * parent.pct).toFixed(4));
                }

                if (pct >= parent.pct) pct = parseFloat((parent.pct - 0.01).toFixed(4));

                let currentFracPct = bloodData.filter(d => d.type === 'fraction' && d.parentId === parentId && d.id !== editingId).reduce((s, d) => s + d.pct, 0);
                
                if (currentFracPct + pct > parent.pct) {
                    let scale = (parent.pct - pct) / currentFracPct;
                    bloodData.forEach(d => {
                        if (d.type === 'fraction' && d.parentId === parentId && d.id !== editingId) {
                            d.pct = parseFloat((d.pct * scale).toFixed(4));
                        }
                    });
                }
            }

            if (editingId) {
                const index = bloodData.findIndex(d => d.id === editingId);
                bloodData[index] = { id: editingId, type, parentId: type === 'fraction' ? parentId : null, name, pct, color };
                cancelEdit(); 
            } else {
                const newId = 'id_' + Math.random().toString(36).substr(2, 9);
                bloodData.push({ id: newId, type, parentId: type === 'fraction' ? parentId : null, name, pct, color });
                
                document.getElementById('comp-name').value = '';
                document.getElementById('comp-pct').value = '';
                document.getElementById('comp-color').value = getRandomColor();
                updateApp();
            }
        }

        function editItem(id) {
            const item = bloodData.find(d => d.id === id);
            if (!item) return;

            editingId = id;
            toggleAccordion(true); 

            document.querySelector(`input[name="comp-type"][value="${item.type}"]`).checked = true;
            toggleParentSelect();
            updateParentDropdown(); 
            
            if (item.type === 'fraction') {
                document.getElementById('parent-select').value = item.parentId;
            }

            document.querySelector('input[name="pct-context"][value="whole"]').checked = true;

            document.getElementById('comp-name').value = item.name;
            document.getElementById('comp-pct').value = item.pct;
            document.getElementById('comp-color').value = item.color;

            document.getElementById('btn-submit').textContent = "Actualizar Componente";
            document.getElementById('btn-cancel').style.display = 'block';
        }

        function cancelEdit() {
            editingId = null;
            document.getElementById('btn-submit').textContent = "Añadir al Gráfico";
            document.getElementById('btn-cancel').style.display = 'none';
            
            document.getElementById('comp-name').value = '';
            document.getElementById('comp-pct').value = '';
            document.getElementById('comp-color').value = getRandomColor();
            
            document.querySelector('input[name="comp-type"][value="main"]').checked = true;
            document.querySelector('input[name="pct-context"][value="whole"]').checked = true;
            toggleParentSelect();
            
            updateApp();
        }

        function deleteItem(id) {
            if (editingId === id || bloodData.some(d => d.parentId === id && d.id === editingId)) {
                cancelEdit();
            }
            bloodData = bloodData.filter(d => d.id !== id && d.parentId !== id);
            updateApp();
        }

        // --- App Rendering ---

        function updateApp() {
            updateParentDropdown();
            renderList();
            prepareChartData(); // Calculate arrays for Area and Pie charts
            drawCanvas(); // Render appropriate chart
        }

        function updateParentDropdown() {
            const select = document.getElementById('parent-select');
            const currentValue = select.value;
            select.innerHTML = '<option value="" disabled selected>Seleccionar Componente Principal</option>';
            
            bloodData.filter(d => d.type === 'main').forEach(main => {
                const option = document.createElement('option');
                option.value = main.id;
                option.textContent = `${main.name} (${main.pct}%)`;
                select.appendChild(option);
            });
            
            if(currentValue && bloodData.find(d => d.id === currentValue)) {
                select.value = currentValue;
            }
        }

        function renderList() {
            const listContainer = document.getElementById('components-list');
            listContainer.innerHTML = '';
            let totalPct = 0;

            const mainComps = bloodData.filter(d => d.type === 'main');
            
            mainComps.forEach(main => {
                totalPct += main.pct;
                listContainer.innerHTML += `
                    <div class="component-item" data-id="${main.id}" onmouseenter="sidebarHover('${main.id}')" onmouseleave="sidebarUnhover()" onclick="sidebarClick('${main.id}', event)">
                        <div class="item-info">
                            <div class="color-dot" style="background-color: ${main.color}"></div>
                            <strong>${main.name}</strong> <span>${main.pct}%</span>
                        </div>
                        <div class="item-actions">
                            <button class="btn-action btn-edit" onclick="editItem('${main.id}'); event.stopPropagation();" title="Editar">✎</button>
                            <button class="btn-action btn-delete" onclick="deleteItem('${main.id}'); event.stopPropagation();" title="Eliminar">✕</button>
                        </div>
                    </div>
                `;

                const fractions = bloodData.filter(d => d.type === 'fraction' && d.parentId === main.id);
                fractions.forEach(frac => {
                    listContainer.innerHTML += `
                        <div class="component-item fraction" data-id="${frac.id}" onmouseenter="sidebarHover('${frac.id}')" onmouseleave="sidebarUnhover()" onclick="sidebarClick('${frac.id}', event)">
                            <div class="item-info">
                                <div class="color-dot" style="background-color: ${frac.color}"></div>
                                <span>${frac.name}</span> <span class="pct">${frac.pct}%</span>
                            </div>
                            <div class="item-actions">
                                <button class="btn-action btn-edit" onclick="editItem('${frac.id}'); event.stopPropagation();" title="Editar">✎</button>
                                <button class="btn-action btn-delete" onclick="deleteItem('${frac.id}'); event.stopPropagation();" title="Eliminar">✕</button>
                            </div>
                        </div>
                    `;
                });
            });

            document.getElementById('total-pct-label').textContent = totalPct.toFixed(2);
            updateSidebarActiveState();
        }

        // Calculate `cellsData` (Area Chart) and `pieSlices` (Pie Chart) synchronously
        function prepareChartData() {
            cellsData.fill(null);
            pieSlices = [];
            let cellCount = 0;
            const totalCells = 10000;

            const mainComps = bloodData.filter(d => d.type === 'main');

            // 1. Build Grid Array (10,000 cells)
            mainComps.forEach(main => {
                let mainTotalCells = Math.round(main.pct * 100);
                let fractions = bloodData.filter(d => d.type === 'fraction' && d.parentId === main.id);
                let fractionCellsAllocated = 0;

                fractions.forEach(frac => {
                    let fracCells = Math.round(frac.pct * 100);
                    for(let i=0; i<fracCells; i++) {
                        if (cellCount < totalCells) {
                            cellsData[cellCount++] = { id: frac.id, mainId: main.id, name: frac.name + " (Fracción)", pct: frac.pct, mainName: main.name, color: frac.color };
                            fractionCellsAllocated++;
                        }
                    }
                });

                let remainingMainCells = mainTotalCells - fractionCellsAllocated;
                for(let i=0; i<remainingMainCells; i++) {
                    if (cellCount < totalCells) {
                        let remPct = (remainingMainCells / 100).toFixed(2);
                        cellsData[cellCount++] = { id: main.id, mainId: main.id, name: main.name + " (Principal)", pct: remPct, mainName: null, color: main.color };
                    }
                }
            });

            const isDark = document.body.classList.contains('dark-mode');
            const emptyColor = isDark ? '#1e293b' : '#f1f5f9';

            while(cellCount < totalCells) {
                 cellsData[cellCount++] = { id: 'empty', mainId: null, name: "Vacío / Sin asignar", pct: ((totalCells - cellCount)/100).toFixed(2), mainName: null, color: emptyColor };
            }

            // 2. Build Pie Slices precisely matching proportional groups from cellsData
            if (cellsData.length > 0) {
                let currentSlice = { ...cellsData[0], startCell: 0, count: 1 };
                for (let i = 1; i < totalCells; i++) {
                    if (cellsData[i].id === currentSlice.id) {
                        currentSlice.count++;
                    } else {
                        pieSlices.push(currentSlice);
                        currentSlice = { ...cellsData[i], startCell: i, count: 1 };
                    }
                }
                pieSlices.push(currentSlice);

                // Convert counts to Radian Angles (starting at 12 o'clock => -PI/2)
                const TWO_PI = Math.PI * 2;
                pieSlices.forEach(slice => {
                    slice.startAngle = -Math.PI / 2 + (slice.startCell / totalCells) * TWO_PI;
                    slice.endAngle = slice.startAngle + (slice.count / totalCells) * TWO_PI;
                });
            }
        }

        function drawCanvas() {
            const canvas = document.getElementById('grid-canvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;
            
            ctx.clearRect(0, 0, w, h);
            
            let activeId = pinnedId || hoveredId;
            let activeMain = bloodData.find(d => d.id === activeId && d.type === 'main');

            if (currentChartType === 'area') {
                drawAreaChart(ctx, w, h, activeId, activeMain);
            } else {
                drawPieChart(ctx, w, h, activeId, activeMain);
            }
        }

        function drawAreaChart(ctx, w, h, activeId, activeMain) {
            const GRID_SIZE = 100;
            const cellW = w / GRID_SIZE;
            const cellH = h / GRID_SIZE;
            const isDark = document.body.classList.contains('dark-mode');

            for(let i=0; i<10000; i++) {
                let cell = cellsData[i];
                if(!cell) continue;
                
                let x = (i % GRID_SIZE) * cellW;
                let y = Math.floor(i / GRID_SIZE) * cellH;
                
                ctx.fillStyle = cell.color;
                
                if (activeId && activeId !== 'empty') {
                    if (activeMain) {
                        ctx.globalAlpha = (cell.mainId !== activeId && cell.id !== 'empty') ? 0.15 : 1.0;
                    } else {
                        ctx.globalAlpha = (cell.id !== activeId && cell.id !== 'empty') ? 0.15 : 1.0;
                    }
                } else {
                    ctx.globalAlpha = 1.0;
                }
                
                ctx.fillRect(x, y, cellW, cellH);
                
                ctx.strokeStyle = isDark ? "rgba(255,255,255,0.05)" : "rgba(255,255,255,0.4)";
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, cellW, cellH);
            }
            ctx.globalAlpha = 1.0;
            
            // Draw Main Component Border
            if (activeMain) {
                ctx.beginPath();
                ctx.strokeStyle = activeMain.color;
                ctx.lineWidth = 4;
                
                for(let i=0; i<10000; i++) {
                    let cell = cellsData[i];
                    if(cell && cell.mainId === activeId) {
                        let x = (i % GRID_SIZE) * cellW;
                        let y = Math.floor(i / GRID_SIZE) * cellH;

                        if (i < 100 || cellsData[i - 100]?.mainId !== activeId) { ctx.moveTo(x, y); ctx.lineTo(x + cellW, y); }
                        if (i >= 9900 || cellsData[i + 100]?.mainId !== activeId) { ctx.moveTo(x, y + cellH); ctx.lineTo(x + cellW, y + cellH); }
                        if (i % 100 === 0 || cellsData[i - 1]?.mainId !== activeId) { ctx.moveTo(x, y); ctx.lineTo(x, y + cellH); }
                        if ((i + 1) % 100 === 0 || cellsData[i + 1]?.mainId !== activeId) { ctx.moveTo(x + cellW, y); ctx.lineTo(x + cellW, y + cellH); }
                    }
                }
                ctx.stroke();
            }
        }

        function drawPieChart(ctx, w, h, activeId, activeMain) {
            const cx = w / 2;
            const cy = h / 2;
            const radius = Math.min(w, h) / 2 * 0.95;
            const isDark = document.body.classList.contains('dark-mode');

            pieSlices.forEach(slice => {
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, slice.startAngle, slice.endAngle);
                ctx.closePath();

                ctx.fillStyle = slice.color;

                if (activeId && activeId !== 'empty') {
                    if (activeMain) {
                        ctx.globalAlpha = (slice.mainId === activeId || slice.id === 'empty') ? 1.0 : 0.15;
                    } else {
                        ctx.globalAlpha = (slice.id === activeId || slice.id === 'empty') ? 1.0 : 0.15;
                    }
                } else {
                    ctx.globalAlpha = 1.0;
                }
                ctx.fill();

                // Separator lines
                ctx.lineWidth = 1;
                ctx.strokeStyle = isDark ? "rgba(0,0,0,0.5)" : "rgba(255,255,255,0.8)";
                ctx.stroke();
            });

            ctx.globalAlpha = 1.0;

            // Draw thick border for active main component
            if (activeMain) {
                let mainSlices = pieSlices.filter(s => s.mainId === activeId);
                if (mainSlices.length > 0) {
                    let startAngle = mainSlices[0].startAngle;
                    let endAngle = mainSlices[mainSlices.length - 1].endAngle;

                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.arc(cx, cy, radius, startAngle, endAngle);
                    ctx.closePath();
                    
                    ctx.strokeStyle = activeMain.color;
                    ctx.lineWidth = 6; // Thicker border for clarity on pie
                    ctx.stroke();
                }
            }
        }

        // --- Interaction Logic ---
        
        const canvas = document.getElementById('grid-canvas');
        const tooltip = document.getElementById('tooltip');
        const vizArea = document.querySelector('.viz-area');

        function toggleAccordion(forceOpen = false) {
            const content = document.getElementById('form-content');
            const chevron = document.getElementById('form-chevron');
            if (forceOpen === true || !content.classList.contains('open')) {
                content.classList.add('open');
                chevron.classList.add('open');
            } else {
                content.classList.remove('open');
                chevron.classList.remove('open');
            }
        }

        function updateTooltipContent(item) {
            let tooltipHTML = '';
            if (pinnedId) {
                tooltipHTML += `<div class="close-tooltip" onclick="unpin(event)">×</div>`;
            }

            if (!item || item.id === 'empty') {
                tooltipHTML += `<strong>Vacío / Sin asignar</strong>`;
                tooltip.innerHTML = tooltipHTML;
                return;
            }

            if (item.type === 'main') {
                tooltipHTML += `<strong>${item.name}</strong><br/><span class="pct">${item.pct}% de la Sangre Total</span>`;
                let fractions = bloodData.filter(d => d.type === 'fraction' && d.parentId === item.id);
                
                if (fractions.length > 0) {
                    tooltipHTML += `<div style="margin-top:10px; border-top:1px solid #334155; padding-top:10px;">`;
                    tooltipHTML += `<strong style="font-size:0.8rem; color:#94a3b8; display:block; margin-bottom:5px;">Desglose de fracciones:</strong>`;
                    tooltipHTML += `<ul style="margin: 0 0 0 5px; padding: 0; font-size: 0.8rem; color: #cbd5e1; list-style-type: none;">`;
                    fractions.forEach(frac => {
                        let pctOfMain = ((frac.pct / item.pct) * 100).toFixed(2);
                        tooltipHTML += `<li style="margin-bottom: 4px;"><span style="color:${frac.color}; font-size: 1.2em; vertical-align: middle;">■</span> <b>${frac.name}:</b> ${pctOfMain}% de este comp. <i>(${frac.pct}% del total)</i></li>`;
                    });
                    tooltipHTML += `</ul></div>`;
                }
            } else {
                let parent = bloodData.find(d => d.id === item.parentId);
                tooltipHTML += `<strong>${item.name}</strong><br/><span class="pct">${item.pct}% de la Sangre Total</span>`;
                if(parent) {
                    let pctOfMain = ((item.pct / parent.pct) * 100).toFixed(2);
                    tooltipHTML += `<br/><small style="color:#cbd5e1;">Dentro de: ${parent.name} (${pctOfMain}% de su volumen)</small>`;
                }
            }
            tooltip.innerHTML = tooltipHTML;
        }

        function positionTooltip(clientX, clientY) {
            tooltip.style.display = 'block';
            if (pinnedId) {
                tooltip.classList.add('pinned');
            } else {
                tooltip.classList.remove('pinned');
            }

            const tooltipRect = tooltip.getBoundingClientRect();
            
            let top = clientY - tooltipRect.height - 15;
            let left = clientX - (tooltipRect.width / 2);

            if (top < 10) top = clientY + 20; 
            if (left < 10) left = 10;
            if (left + tooltipRect.width > window.innerWidth - 10) {
                left = window.innerWidth - tooltipRect.width - 10;
            }

            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
        }

        canvas.addEventListener('mousemove', (e) => {
            if (pinnedId) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            
            let foundId = null;

            if (currentChartType === 'area') {
                const gridX = Math.floor(x / (canvas.width / 100));
                const gridY = Math.floor(y / (canvas.height / 100));
                const index = gridY * 100 + gridX;
                if (index >= 0 && index < 10000) {
                    const cell = cellsData[index];
                    if (cell) foundId = cell.id;
                }
            } else {
                // Pie chart math
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                const radius = Math.min(canvas.width, canvas.height) / 2 * 0.95;
                const dx = x - cx;
                const dy = y - cy;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist <= radius) {
                    let angle = Math.atan2(dy, dx);
                    if (angle < -Math.PI / 2) {
                        angle += 2 * Math.PI; // Match with startAngle [-PI/2 to 1.5PI]
                    }
                    const slice = pieSlices.find(s => angle >= s.startAngle && angle <= s.endAngle);
                    if (slice) foundId = slice.id;
                }
            }

            if (foundId && foundId !== hoveredId) {
                hoveredId = foundId;
                drawCanvas();
            }
            
            if (foundId && foundId !== 'empty') {
                const item = bloodData.find(d => d.id === foundId);
                updateTooltipContent(item);
                positionTooltip(e.clientX, e.clientY);
            } else {
                tooltip.style.display = 'none';
            }
        });

        canvas.addEventListener('mouseout', (e) => {
            if (pinnedId) return;
            hoveredId = null;
            tooltip.style.display = 'none';
            drawCanvas();
        });

        canvas.addEventListener('click', (e) => {
            if (!hoveredId || hoveredId === 'empty') return;
            
            if (pinnedId === hoveredId) {
                unpin();
            } else {
                pinnedId = hoveredId;
                const item = bloodData.find(d => d.id === pinnedId);
                if (item) {
                    updateTooltipContent(item);
                    positionTooltip(e.clientX, e.clientY);
                    drawCanvas();
                }
            }
        });

        function unpin(e) {
            if (e) e.stopPropagation();
            pinnedId = null;
            hoveredId = null;
            updateSidebarActiveState();
            tooltip.style.display = 'none';
            drawCanvas();
        }

        function sidebarHover(id) {
            if (pinnedId) return;
            hoveredId = id;
            drawCanvas();
        }

        function sidebarUnhover() {
            if (pinnedId) return;
            hoveredId = null;
            drawCanvas();
        }

        function sidebarClick(id, event) {
            if (pinnedId === id) {
                unpin();
            } else {
                pinnedId = id;
                hoveredId = id;
                updateSidebarActiveState();
                drawCanvas();
                
                const item = bloodData.find(d => d.id === id);
                if (item) {
                    updateTooltipContent(item);
                    const rect = vizArea.getBoundingClientRect();
                    const centerX = rect.left + (rect.width / 2);
                    const centerY = rect.top + (rect.height / 2);
                    positionTooltip(centerX, centerY);
                }
            }
        }

        function updateSidebarActiveState() {
            document.querySelectorAll('.component-item').forEach(el => {
                if (pinnedId && el.getAttribute('data-id') === pinnedId) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }

        // Init App
        updateApp();
    </script>
</body>
</html>
